plugins {
    id 'com.android.application'
}

// One version number for the whole project (desktop and Android): desktop/VERSION.
def ayracVersion = rootProject.file('../desktop/VERSION').text.trim()
def parts = ayracVersion.tokenize('.').collect { it.toInteger() } + [0, 0, 0]
def ayracCode = parts[0] * 10000 + parts[1] * 100 + parts[2]

// Release signing: android/keystore.properties (not in git) points at the keystore made by android/build.ps1.
def keyProps = new Properties()
def keyFile = rootProject.file('keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'com.tahir.ayrac'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tahir.ayrac'
        minSdk 26
        targetSdk 34
        versionCode ayracCode
        versionName ayracVersion
        // The neural voice engine (sherpa-onnx) ships native code; 64-bit ARM phones only, to keep the APK small.
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile rootProject.file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging true }  // compressed in the APK (smaller download)
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.anthropic:anthropic-java:2.34.0'
    // Neural reading voices: sherpa-onnx (android\app\libs, fetched by build.ps1) and bzip2/tar for the voice files
    implementation files('libs/sherpa-onnx-static-link-onnxruntime-1.13.8.aar')
    implementation 'org.apache.commons:commons-compress:1.21'

    // Unit tests (android\test.ps1): the shared dictionary cases, with JDBC SQLite and the real org.json
    // instead of the android.jar stubs.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}
